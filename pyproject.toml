[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baton"
version = "0.1.0"
description = "When Claude Code turns down a request, ask another AI and bring its answer back"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Trenton Taylor" }]
keywords = ["claude", "claude-code", "handoff", "xai", "grok", "openai", "ollama"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[tool.setuptools.packages.find]
include = ["baton*", "claude_handoff*"]

[tool.setuptools.package-data]
baton = ["check-step.md"]
